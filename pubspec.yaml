name: portfolio_app
description: Vachaspati Mishra - Flutter Developer Portfolio
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  riverpod: ^2.4.0
  flutter_riverpod: ^2.4.0
  animate_do: ^3.1.0
  flutter_animate: ^4.2.0
  url_launcher: ^6.1.14
  go_router: ^10.1.0
  font_awesome_flutter: ^10.5.0
  cupertino_icons: ^1.0.2
  http: ^1.1.0
  dio: ^5.3.0
  shared_preferences: ^2.2.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/images/projects/
    - assets/images/profile/
    - assets/images/backgrounds/
    - assets/icons/
    - assets/icons/social/
    - assets/icons/tech/
  
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
    
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Regular.ttf
        - asset: assets/fonts/SpaceGrotesk-Bold.ttf
          weight: 700